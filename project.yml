# Xcode project definition. Regenerate with `xcodegen generate` after changing it.
name: Midiot
options:
  bundleIdPrefix: dev.midiot
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MidiotKit:
    path: MidiotKit
targets:
  Midiot:
    type: application
    platform: macOS
    sources:
      - App
      # Folder reference: every file in it, including fetched SoundFonts, is copied into the app.
      - path: Resources/SoundFonts
        type: folder
        buildPhase: resources
      # Starter pieces copied into the library on first launch.
      - path: Resources/Songs
        type: folder
        buildPhase: resources
    dependencies:
      - { package: MidiotKit, product: MusicCore }
      - { package: MidiotKit, product: MidiIO }
      - { package: MidiotKit, product: Sound }
      - { package: MidiotKit, product: ScoreImport }
      - { package: MidiotKit, product: Notation }
      - { package: MidiotKit, product: Practice }
      - { package: MidiotKit, product: Library }
      - { package: MidiotKit, product: DesignSystem }
      - { package: MidiotKit, product: Sketch }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.midiot.Midiot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_CFBundleDisplayName: Midiot
        # Signed with the team so the app may use iCloud for plays.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 99U97P63K6
        CODE_SIGN_ENTITLEMENTS: App/Midiot.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The iPad app: Sketchpad, Stage and Chords, for rehearsals and away from the desk.
  MidiotPad:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - App
      # Only the small General MIDI set; the grand piano samples are too big for an iPad.
      - path: Resources/SoundFontsPad
        type: folder
        buildPhase: resources
    dependencies:
      - { package: MidiotKit, product: MusicCore }
      - { package: MidiotKit, product: MidiIO }
      - { package: MidiotKit, product: Sound }
      - { package: MidiotKit, product: ScoreImport }
      - { package: MidiotKit, product: Notation }
      - { package: MidiotKit, product: Practice }
      - { package: MidiotKit, product: Library }
      - { package: MidiotKit, product: DesignSystem }
      - { package: MidiotKit, product: Sketch }
    settings:
      base:
        PRODUCT_NAME: Midiot
        PRODUCT_BUNDLE_IDENTIFIER: dev.midiot.Midiot
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_CFBundleDisplayName: Midiot
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 99U97P63K6
        CODE_SIGN_ENTITLEMENTS: App/Midiot.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Midiot:
    build:
      targets:
        Midiot: all
    run:
      config: Debug
  MidiotPad:
    build:
      targets:
        MidiotPad: all
    run:
      config: Debug
